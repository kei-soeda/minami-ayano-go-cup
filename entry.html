<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 参加者名を載せるため、検索エンジンには表示しない -->
<meta name="robots" content="noindex, nofollow">
<title>参加申込｜第7回 ミナミの綾野剛コンペ</title>
<meta name="description" content="第7回ミナミの綾野剛コンペ（2026年11月25日（水）開催）の参加申込ページ。お名前を入力して、ゴルフと表彰式・2次会の参加可否を選んでください。">

<!-- Open Graph / LINE・SNS共有用 -->
<meta property="og:type" content="website">
<meta property="og:locale" content="ja_JP">
<meta property="og:site_name" content="ミナミの綾野剛コンペ">
<meta property="og:title" content="参加申込｜第7回 ミナミの綾野剛コンペ">
<meta property="og:description" content="2026年11月25日（水）開催。お名前を入力して、○・△・× を選ぶだけで申込できます。">
<meta property="og:url" content="https://minami-ayano-go.github.io/competition202611/entry.html">
<meta property="og:image" content="https://minami-ayano-go.github.io/competition202611/images/icon/ogp.png?v=20261002">
<meta property="og:image:alt" content="ミナミの綾野剛コンペ">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B0B0B">

<link rel="icon" type="image/png" sizes="64x64" href="images/icon/favicon.png?v=20261002">
<link rel="apple-touch-icon" sizes="180x180" href="images/icon/apple-touch-icon.png?v=20261002">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Shippori+Mincho+B1:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css?v=20261002">
</head>
<body>

<!-- ============ ヘッダー ============ -->
<header class="hdr is-scrolled">
  <div class="wrap hdr-bar">
    <a href="./" class="brand" aria-label="ミナミの綾野剛コンペ トップへ">
      <span class="brand-mark" aria-hidden="true"><img class="emblem" src="images/icon/logo.webp?v=20261002" alt="" width="48" height="48"></span>
      <span class="brand-text">
        <span class="brand-name">Midnight Minami Open</span>
        <span class="brand-jp">ミナミの綾野剛コンペ</span>
      </span>
    </a>
    <a href="./" class="hdr-entry">Top</a>
  </div>
</header>

<main>
<section class="sec entry entry-page">
  <div class="glow-amber glow-amber--bottom" aria-hidden="true"></div>
  <div class="wrap" style="position:relative">
    <h1 class="sec-head" style="margin-bottom:0"><span class="sec-en">Entry</span><span class="sec-jp">参加申込</span></h1>
    <p class="entry-date">第7回　2026年11月25日（水）</p>
    <p class="sec-lead" style="text-align:center">お名前を入力して、○・△・× を選んでください。<br>締切：【申込締切】</p>

    <div class="entry-board" id="entryBoard">
      <p class="entry-summary" id="entrySummary" aria-live="polite">読み込み中…</p>
      <table class="tbl entry-table" id="entryTable" hidden>
        <caption class="sr-only">参加者一覧</caption>
        <thead><tr><th scope="col">お名前</th><th scope="col">ゴルフ</th><th scope="col">表彰式<br>2次会</th></tr></thead>
        <tbody id="entryRows"></tbody>
      </table>
      <p class="note entry-hint">自分の名前を押すと、回答を変更・削除できます。<br>組み合わせが決まり次第、大会ページでお知らせします。</p>

      <form class="entry-form gold-frame" id="entryForm" novalidate>
        <h2 class="entry-form-title" id="entryFormTitle">回答を入力する</h2>
        <label class="entry-field">
          <span class="entry-label">お名前<small>ニックネーム可・一覧に表示されます</small></span>
          <input type="text" name="name" maxlength="20" autocomplete="nickname" required>
        </label>
        <fieldset class="entry-field">
          <legend class="entry-label">ゴルフ</legend>
          <div class="entry-choices">
            <label><input type="radio" name="golf" value="○"><span>○<small>参加</small></span></label>
            <label><input type="radio" name="golf" value="△"><span>△<small>未定</small></span></label>
            <label><input type="radio" name="golf" value="×"><span>×<small>不参加</small></span></label>
          </div>
        </fieldset>
        <fieldset class="entry-field">
          <legend class="entry-label">表彰式・2次会</legend>
          <div class="entry-choices">
            <label><input type="radio" name="party" value="○"><span>○<small>参加</small></span></label>
            <label><input type="radio" name="party" value="△"><span>△<small>未定</small></span></label>
            <label><input type="radio" name="party" value="×"><span>×<small>不参加</small></span></label>
          </div>
        </fieldset>
        <label class="entry-field">
          <span class="entry-label">コメント<small>任意</small></span>
          <input type="text" name="comment" maxlength="100">
        </label>
        <!-- ボット対策：人には見えない入力欄。値が入っていたら GAS 側で保存しない -->
        <input class="entry-trap" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p class="entry-message" id="entryMessage" role="status"></p>
        <div class="entry-actions">
          <button type="submit" class="btn btn--fill"><b>Entry</b><small id="entrySubmitLabel">回答する</small></button>
          <button type="button" class="entry-sub" id="entryCancel" hidden>変更をやめる</button>
          <button type="button" class="entry-sub entry-sub--danger" id="entryDelete" hidden>この回答を削除する</button>
        </div>
      </form>
    </div>

    <p class="entry-back"><a class="text-link" href="./">大会の詳細（日程・ルール・注意事項）を見る</a></p>
  </div>
</section>
</main>

<footer class="footer footer--simple">
  <div class="wrap">
    <p class="copy">© 2026 Minami Ayano Go Cup</p>
  </div>
</footer>

<script src="js/entry.js?v=20261002"></script>
</body>
</html>
